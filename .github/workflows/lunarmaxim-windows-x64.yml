name: LunarMaxim Windows x64

# Explicit build via tag on the maintained branch; master stays on upstream.
on:
  push:
    tags:
      - 'lunarmaxim-win-x64-*'

permissions:
  contents: read

env:
  RUST_VERSION: '1.75'
  FLUTTER_VERSION: '3.24.5'
  BRIDGE_FLUTTER_VERSION: '3.22.3'
  LLVM_VERSION: '15.0.6'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

jobs:
  bridge:
    if: github.repository == 'LunarMaxim/rustdesk'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ git libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Generate the native bridge for the exact source commit
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          # Match the upstream bridge job; only the runner's lookup uses 3.22.3.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          for file in src/bridge_generated.rs src/bridge_generated.io.rs flutter/lib/generated_bridge.dart flutter/lib/generated_bridge.freezed.dart; do
            test -s "$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lunar-windows-x64-bridge
          if-no-files-found: error
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart

  window-injection:
    if: github.repository == 'LunarMaxim/rustdesk'
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows-x64:
    needs: [bridge, window-injection]
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lunar-windows-x64-bridge
          path: .
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
      - name: Install the upstream Windows x64 Flutter engine
        run: |
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter precache failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'windows-x64-release.zip'
          Invoke-WebRequest -Uri 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'EC8CABF36EE4FF24C8D98DE25B00E70781EB03876265AEE84D0FE554A110036E') {
            throw 'Upstream x64 engine archive checksum mismatch'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'lunar-x64-engine'
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          $flutterRoot = Split-Path (Split-Path (Get-Command flutter.bat).Source -Parent) -Parent
          $engine = Join-Path $flutterRoot 'bin/cache/artifacts/engine/windows-x64-release'
          if (-not (Test-Path $engine)) { throw 'Flutter Windows x64 engine directory is missing' }
          Copy-Item -Path "$expanded/*" -Destination $engine -Recurse -Force
      - name: Apply the upstream Flutter 3.24 dropdown patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "$patch"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: lunar-windows-x64
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Install native dependencies
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - name: Build the Windows client and run focused Rust and Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          features=$(python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram --print-features)
          cargo test --locked --release --lib --features "$features" reverse_session_takeover::tests::
          (cd flutter && flutter test test/connection_manager_presentation_test.dart)
          mv flutter/build/windows/x64/runner/Release rustdesk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: rustdesk
      - name: Include the upstream virtual-display payload
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'usbmmidd_v2.zip'
          Invoke-WebRequest -Uri 'https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '629B51E9944762BAE73948171C65D09A79595CF4C771A82EBC003FBBA5B24F51') {
            throw 'Virtual-display archive checksum mismatch'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'virtual-display'
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          $package = Join-Path $expanded 'usbmmidd_v2'
          foreach ($path in 'Win32', 'deviceinstaller64.exe', 'deviceinstaller.exe', 'usbmmidd.bat') {
            $entry = Join-Path $package $path
            if (Test-Path -LiteralPath $entry) { Remove-Item -LiteralPath $entry -Recurse -Force }
          }
          Move-Item -LiteralPath $package -Destination rustdesk
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with:
          msbuild-architecture: x86
      - name: Package the locally built RustDesk variant
        run: |
          foreach ($f in 'rustdesk.exe','librustdesk.dll','data/app.so','WindowInjection.dll') {
            if (-not (Test-Path -LiteralPath "rustdesk/$f" -PathType Leaf)) { throw "Missing binary payload: $f" }
          }
          $version = ((Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Path $out | Out-Null
          Push-Location res/msi
          try {
            python preprocess.py --arp -d ../../rustdesk
            if ($LASTEXITCODE -ne 0) { throw 'MSI preprocessing failed' }
            nuget restore msi.sln
            if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed' }
            msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
            if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
            $msi = @(Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi)
            if ($msi.Count -ne 1) { throw 'Expected one x64 installer' }
            Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $out "rustdesk-$version-lunarmaxim-x64.msi")
          } finally { Pop-Location }
          Compress-Archive -Path rustdesk/* -DestinationPath (Join-Path $out "rustdesk-$version-lunarmaxim-x64-payload.zip")
          $env:GITHUB_SHA | Set-Content -LiteralPath (Join-Path $out 'source-commit.txt') -Encoding ascii
          Get-ChildItem -LiteralPath $out -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS') -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-lunarmaxim-windows-x64
          path: artifacts/
          if-no-files-found: error
